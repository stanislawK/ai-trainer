# Weekly update PRs for every ecosystem the repo ships (ADR-0023). Alerts and security
# updates are separate repository settings — see deploy/github-hardening.md.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Hold SQLAlchemy 2.1: opentelemetry-instrumentation-sqlalchemy 0.66b2 pins
      # sqlalchemy<2.1.0, and 2.1 also fails mypy. 2.0.x patches are still proposed.
      # Remove this ignore when the migration ticket (#501) lands.
      - dependency-name: sqlalchemy
        versions: [">=2.1.0"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # ADR-0002 locks Python 3.14: a new minor (3.15) is a stack change through /update-docs,
    # not a Dependabot bump. Patch and base-image digest updates still come through.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
