name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgresql+psycopg://ai_trainer:ai_trainer@localhost:5432/ai_trainer
  # Settings() requires this to construct (ADR-0007); no test ever makes a real call with it
  # (ADR-0013 invariant 1), so a placeholder is enough.
  OPENROUTER_API_KEY: sk-or-v1-ci-placeholder-not-a-real-key

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      # Same image and credentials as compose.yaml (ADR-0004); integration
      # tests read DATABASE_URL from the environment exactly like locally.
      db:
        image: pgvector/pgvector:pg18-trixie
        env:
          POSTGRES_USER: ai_trainer
          POSTGRES_PASSWORD: ai_trainer
          POSTGRES_DB: ai_trainer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_trainer -d ai_trainer"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
          --shm-size 256mb
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # uv itself isn't a locked project dependency (uv.lock has no [[package]]
          # name = "uv" entry), so version-file: uv.lock can't resolve a version —
          # pin explicitly instead, matching the Dockerfile's uv pin (ADR-0002).
          version: "0.11.28"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (mypy --strict)
        run: uv run mypy

      - name: Import boundaries (import-linter)
        run: uv run lint-imports

      - name: OpenAPI snapshot drift check
        run: |
          uv run python scripts/generate_openapi.py
          git diff --exit-code -- docs/api/openapi.json

      - name: Run database migrations (Alembic)
        run: uv run alembic upgrade head

      - name: Test (pytest)
        run: uv run pytest

  e2e:
    # Only after the fast gates above pass, to avoid building images and a browser for a
    # commit that's already broken (ADR-0013: "E2E joins CI once the first spec exists").
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # --with-deps also installs Ubuntu system packages and needs sudo (this runner has
      # it); a dev machine's `make e2e-install` deliberately doesn't use this flag.
      - name: Install Playwright's Chromium
        run: uv run playwright install --with-deps chromium

      - name: Write .env for docker compose
        # compose.yaml reads secrets from `.env` (env_file:), not from this job's own
        # environment; OPENROUTER_API_KEY here matches the workflow-level placeholder above.
        run: |
          cp .env.example .env
          sed -i "s#^OPENROUTER_API_KEY=.*#OPENROUTER_API_KEY=${OPENROUTER_API_KEY}#" .env

      - name: Start the compose stack
        run: docker compose up -d --build

      - name: Wait for the app to become healthy
        run: |
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          echo "app did not become healthy in time" >&2
          docker compose logs
          exit 1

      - name: Run e2e specs (pytest-playwright)
        run: make e2e

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop the compose stack
        if: always()
        run: docker compose down
