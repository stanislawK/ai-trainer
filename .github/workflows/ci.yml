name: CI

on:
  # `main` only: a pull request runs once, on `pull_request`, not twice (#356). A tag starts
  # nothing but release.yml, and a release tag points at a commit CI already tested on main (#219).
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgresql+psycopg://ai_trainer:ai_trainer@localhost:5432/ai_trainer
  # Settings() requires this to construct (ADR-0007); no test ever makes a real call with it
  # (ADR-0013 invariant 1), so a placeholder is enough.
  OPENROUTER_API_KEY: sk-or-v1-ci-placeholder-not-a-real-key
  # Settings() requires this too (ADR-0009); evals never run on push/pull_request — only in
  # evals.yml, which is workflow_dispatch-only — so a placeholder is enough here as well.
  EVAL_JUDGE_MODEL: ci-placeholder-not-a-real-model
  # Settings() requires this too (ADR-0008); no test calls a real model, so a placeholder is enough.
  ROUTER_MODEL: ci-placeholder-not-a-real-router-model
  CHITCHAT_MODEL: ci-placeholder-not-a-real-chitchat-model
  EXTRACT_MODEL: ci-placeholder-not-a-real-extract-model
  # Settings() rejects a blank Google sign-in key at startup (ADR-0005). CI never signs in with
  # Google (tests fake the OAuth client, e2e seeds sessions), so placeholders are enough.
  GOOGLE_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
  GOOGLE_CLIENT_SECRET: ci-placeholder-not-a-real-secret
  SESSION_SECRET_KEY: ci-placeholder-session-secret-key
  CSRF_SECRET_KEY: ci-placeholder-csrf-secret-key
  # Required origin (ADR-0023); the e2e job reaches the app at localhost:8000, which the
  # trusted-host check admits only for this value.
  PUBLIC_BASE_URL: http://localhost:8000


# `changes` decides which check jobs a pull request's paths need; those start together after it,
# each on its own runner with its own database, and the `ci` job at the end is the one check
# `main`'s ruleset requires (ADR-0013, "Parallel, path-aware CI").
jobs:
  changes:
    # A job skipped by its own `if:` reports Success; a workflow-level `paths:` filter would leave
    # the required check Pending instead (ADR-0013). A push to `main` runs every job (#357).
    runs-on: ubuntu-latest
    outputs:
      static: ${{ steps.flags.outputs.static }}
      test: ${{ steps.flags.outputs.test }}
      ops: ${{ steps.flags.outputs.ops }}
      e2e: ${{ steps.flags.outputs.e2e }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The script diffs against the pull request's base, origin/<base>.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          enable-cache: true

      # --no-project: the stdlib-only script needs .python-version's Python, not the project.
      - name: Decide which jobs run
        id: flags
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            uv run --no-project python scripts/ci_changes.py --base "origin/$GITHUB_BASE_REF" >> "$GITHUB_OUTPUT"
          else
            uv run --no-project python scripts/ci_changes.py --all >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  static:
    needs: changes
    if: needs.changes.outputs.static == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The squawk step diffs against origin/main to find this branch's new revisions.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # uv itself isn't a locked project dependency (uv.lock has no [[package]]
          # name = "uv" entry), so version-file: uv.lock can't resolve a version —
          # pin explicitly instead; scripts/check_uv_pins.py keeps every pin equal (ADR-0002).
          version: "0.13.6"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (mypy --strict)
        run: uv run mypy

      - name: Import boundaries (import-linter)
        run: uv run lint-imports

      - name: OpenAPI snapshot drift check
        run: |
          uv run python scripts/generate_openapi.py
          git diff --exit-code -- docs/api/openapi.json

      # Offline rendering needs no database, but Settings() reads DATABASE_URL (ADR-0024).
      - name: Lint new migrations (squawk)
        run: uv run python scripts/squawk_migrations.py --base origin/main

      # One uv version in the Dockerfile, both workflows and the uv_build range (ADR-0002, #310).
      - name: Check uv pins agree
        run: uv run python scripts/check_uv_pins.py

  test:
    needs: changes
    if: needs.changes.outputs.test == 'true'
    runs-on: ubuntu-latest
    services:
      # Same image and credentials as compose.yaml (ADR-0004); integration
      # tests read DATABASE_URL from the environment exactly like locally.
      db:
        image: pgvector/pgvector:pg18-trixie
        env:
          POSTGRES_USER: ai_trainer
          POSTGRES_PASSWORD: ai_trainer
          POSTGRES_DB: ai_trainer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_trainer -d ai_trainer"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
          --shm-size 256mb
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The upgrade-with-data test upgrades from the head at the merge base with origin/main.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run database migrations (Alembic)
        run: uv run alembic upgrade head

      - name: Test (pytest)
        run: uv run pytest tests/unit tests/integration tests/migrations

  ops:
    # No database: no test in tests/ops opens one.
    needs: changes
    if: needs.changes.outputs.ops == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # The production host's user data (#222), checked by the cloud-init Debian 13 ships.
      - name: Validate cloud-init (cloud-init schema)
        run: make cloud-init-check

      # The Alloy relay's config (#272), formatted and validated by the image compose runs.
      - name: Validate Alloy config (alloy fmt + validate)
        run: make alloy-check

      - name: Test ops scripts (pytest)
        run: uv run pytest tests/ops

  e2e:
    # Only `needs: changes` (#356, #357): it once waited for the other checks to dodge the #37
    # concurrent-write gotcha, which needs two suites on one database. Each job now has its own
    # runner and database.
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # --with-deps also installs Ubuntu system packages and needs sudo (this runner has
      # it); a dev machine's `make e2e-install` deliberately doesn't use this flag.
      - name: Install Playwright's Chromium
        run: uv run playwright install --with-deps chromium

      - name: Write .env for docker compose
        # compose.yaml reads secrets from `.env` (env_file:), not from this job's own
        # environment; OPENROUTER_API_KEY here matches the workflow-level placeholder above.
        run: |
          cp .env.example .env
          sed -i "s#^OPENROUTER_API_KEY=.*#OPENROUTER_API_KEY=${OPENROUTER_API_KEY}#" .env
          for key in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET SESSION_SECRET_KEY CSRF_SECRET_KEY; do
            sed -i "s#^${key}=.*#${key}=${!key}#" .env
          done

      - name: Start the compose stack
        run: docker compose up -d --build

      - name: Wait for the app to become healthy
        run: |
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          echo "app did not become healthy in time" >&2
          docker compose logs
          exit 1

      # The cache was measured slower and dropped (ADR-0013 "Caches", #358): compose builds this
      # checkout. The running app's `src/` must still match it; app.css is built in the image.
      - name: Check the app runs this commit's src/
        run: |
          digest='find src -type f ! -path "*/__pycache__/*" ! -name app.css -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum'
          checkout=$(sh -c "$digest")
          app=$(docker compose exec -T app sh -c "cd /app && $digest")
          echo "checkout src/: $checkout"
          echo "app src/:      $app"
          test "$checkout" = "$app"

      - name: Run e2e specs (pytest-playwright)
        run: make e2e

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop the compose stack
        if: always()
        run: docker compose down

  ci:
    # The required check: fails when any job failed or was cancelled. A skipped job passes, so a
    # job a pull request's paths don't need never blocks the merge (ADR-0013). `changes` is here
    # too: when it fails, the check jobs are skipped and only its failure stops the merge.
    needs: [changes, static, test, ops, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
