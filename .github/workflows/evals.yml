name: Evals

# Manual only (ADR-0009): evals call real models through OpenRouter and cost money, so this
# never runs on push or pull_request — see ci.yml, which never invokes the eval CLI.
on:
  workflow_dispatch:
    inputs:
      template_id:
        description: Prompt template id (e.g. the dataset at evals/datasets/<template_id>.yaml)
        required: true
      version:
        description: Template version to evaluate (defaults to the version the app runs)
        required: false
        default: ""
      model:
        description: Overrides the model under test (defaults to the template's configured model)
        required: false
      repeat:
        description: Runs every case N times; the baseline averages over all runs
        required: false
        default: "1"
      promote:
        description: Writes the run's figures to the baseline (uploaded below; commit it yourself)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    environment: evals
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # See ci.yml for why this is pinned explicitly rather than via version-file.
          version: "0.11.28"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run the eval
        env:
          # Settings() requires this to construct (ADR-0007), but the eval CLI never touches
          # the database — a placeholder is enough, same as ci.yml.
          DATABASE_URL: postgresql+psycopg://ai_trainer:ai_trainer@localhost:5432/ai_trainer
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          EVAL_JUDGE_MODEL: ${{ secrets.EVAL_JUDGE_MODEL }}
          ROUTER_MODEL: ${{ secrets.ROUTER_MODEL }}
          CHITCHAT_MODEL: ${{ secrets.CHITCHAT_MODEL }}
          EXTRACT_MODEL: ${{ secrets.EXTRACT_MODEL }}
          EXTRACT_PROVIDER: ${{ secrets.EXTRACT_PROVIDER }}
          # Settings() also rejects a blank Google sign-in key (ADR-0005); the eval CLI never
          # signs anyone in, so placeholders are enough.
          GOOGLE_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
          GOOGLE_CLIENT_SECRET: ci-placeholder-not-a-real-secret
          SESSION_SECRET_KEY: ci-placeholder-session-secret-key
          CSRF_SECRET_KEY: ci-placeholder-csrf-secret-key
          PUBLIC_BASE_URL: http://localhost:8000
          # Inputs reach the shell as environment variables, never interpolated into the
          # script text, so an input cannot inject commands (ADR-0023).
          INPUT_TEMPLATE_ID: ${{ inputs.template_id }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_MODEL: ${{ inputs.model }}
          INPUT_REPEAT: ${{ inputs.repeat }}
          INPUT_PROMOTE: ${{ inputs.promote }}
        run: |
          args=(run "$INPUT_TEMPLATE_ID" --repeat "$INPUT_REPEAT")
          if [ -n "$INPUT_VERSION" ]; then
            args+=(--version "$INPUT_VERSION")
          fi
          if [ -n "$INPUT_MODEL" ]; then
            args+=(--model "$INPUT_MODEL")
          fi
          if [ "$INPUT_PROMOTE" = "true" ]; then
            args+=(--promote)
          fi
          uv run ai-trainer-evals "${args[@]}"

      - name: Upload the report and baseline
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evals-${{ inputs.template_id }}
          path: |
            evals/reports/${{ inputs.template_id }}.json
            evals/baselines/${{ inputs.template_id }}.json
