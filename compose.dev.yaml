# Dev-only overlay for `make start`/`make stop` (ticket #62). Named compose.dev.yaml, not
# compose.override.yaml: Compose auto-loads the latter for every bare `docker compose …`
# invocation, which would silently turn on --reload for `make up`, `make up-build` and CI's
# e2e job too. This file is only ever applied explicitly, with `-f compose.yaml -f
# compose.dev.yaml`, so those stay on the plain production image and command (ADR-0002).
#
# Uses Compose Watch (`develop.watch`), not a bind mount, for src/: Watch's `sync` action
# tar-copies changed files into the running container using the host's own file watcher,
# which sidesteps the bind-mount/inotify unreliability that macOS Docker Desktop is known
# for — a bind mount would also need `uv run` at startup to pick up dependency changes,
# which ADR-0002's Consequences already record as broken for the non-root runtime user.
#
# `make start` runs `docker compose build` before `watch` (#64): `watch`'s own implicit
# build only reliably refreshes the image tag of the service it watches (`app`); a sibling
# service built from the identical context but with no `develop.watch` of its own (like
# `migrate` below) can be left on a stale image tag by `watch` alone, serving an out-of-date
# `migrations/` directory. An explicit `build` first keeps every dev-stack image, watched or
# not, in sync with the working tree on every `make start`. See ADR-0002 Consequences.
services:
  app:
    # dev_start.sh runs the Dockerfile's CMD plus --reload (no `uv run`, same non-root-venv
    # reason as production, ADR-0002) alongside a Tailwind `--watch` process that recompiles
    # app.css on every synced template/CSS change (#63, ADR-0012 Consequences).
    command:
      - ./scripts/dev_start.sh
    # Merges with the base file's `depends_on.db` (a mapping, keyed by service — Compose
    # merges matching keys across -f files rather than replacing the whole map) so `app`
    # waits on both `db` being healthy and `migrate` having exited 0 (#64). `make up` and
    # CI's e2e job never load this file, so they're unaffected — the `migrate` service
    # below doesn't exist for them either.
    depends_on:
      migrate:
        condition: service_completed_successfully
    develop:
      watch:
        # Covers both Python routes and Jinja templates: both live under src/ai_trainer/.
        # No `watchfiles` package is locked, so Uvicorn's fallback reloader only polls *.py
        # mtimes — a template-only change never restarts the process; Jinja's own
        # auto_reload (the jinja2.Environment default, never overridden in templating.py)
        # picks up the edited template on the next request instead.
        - action: sync
          path: ./src
          target: /app/src
          ignore:
            - "**/__pycache__"
            - "*.pyc"
        # A dependency change needs a fresh image (`uv sync --locked` runs at build time,
        # ADR-0002), so rebuild rather than sync when either file changes.
        - action: rebuild
          path: ./uv.lock
        - action: rebuild
          path: ./pyproject.toml

  # One-shot: brings the schema to head before `app` starts (#64), so a fresh clone or a
  # newly pulled migration never serves against a stale schema. `alembic upgrade head` is
  # idempotent — already-at-head is a fast no-op, matching `app`'s image (same build) and
  # the same `db`-hostname `DATABASE_URL` override, and needs `env_file: .env` too since
  # `migrations/env.py` constructs a full `Settings()`, which requires OPENROUTER_API_KEY
  # and EVAL_JUDGE_MODEL even though this command never touches either. Runs the venv's own
  # `alembic` binary directly, not `uv run` — ADR-0002's non-root-venv gotcha (a re-sync
  # against the root-owned .venv fails for the nonroot runtime user) applies to any command
  # in this image, not just the app's own CMD.
  migrate:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://ai_trainer:ai_trainer@db:5432/ai_trainer
    depends_on:
      db:
        condition: service_healthy
    command:
      - alembic
      - upgrade
      - head
