# Dev-only overlay for `make start`/`make stop` (ticket #62). Named compose.dev.yaml, not
# compose.override.yaml: Compose auto-loads the latter for every bare `docker compose …`
# invocation, which would silently turn on --reload for `make up`, `make up-build` and CI's
# e2e job too. This file is only ever applied explicitly, with `-f compose.yaml -f
# compose.dev.yaml`, so those stay on the plain production image and command (ADR-0002).
#
# Uses Compose Watch (`develop.watch`), not a bind mount, for src/: Watch's `sync` action
# tar-copies changed files into the running container using the host's own file watcher,
# which sidesteps the bind-mount/inotify unreliability that macOS Docker Desktop is known
# for — a bind mount would also need `uv run` at startup to pick up dependency changes,
# which ADR-0002's Consequences already record as broken for the non-root runtime user.
#
# `make start` runs `docker compose build` before `watch` (#64): `watch`'s own implicit
# build only reliably refreshes the image tag of the service it watches (`app`); a sibling
# service built from the identical context but with no `develop.watch` of its own (like
# `migrate` below) can be left on a stale image tag by `watch` alone, serving an out-of-date
# `migrations/` directory. An explicit `build` first keeps every dev-stack image, watched or
# not, in sync with the working tree on every `make start`. See ADR-0002 Consequences.
services:
  app:
    # dev_start.sh runs the Dockerfile's CMD plus --reload (no `uv run`, same non-root-venv
    # reason as production, ADR-0002) alongside a Tailwind `--watch` process that recompiles
    # app.css on every synced template/CSS change (#63, ADR-0012 Consequences).
    command:
      - ./scripts/dev_start.sh
    # Merges with the base file's `depends_on.db` (a mapping, keyed by service — Compose
    # merges matching keys across -f files rather than replacing the whole map) so `app`
    # waits on both `db` being healthy and `migrate` having exited 0 (#64). `make up` and
    # CI's e2e job never load this file, so they're unaffected — the `migrate` service
    # below doesn't exist for them either.
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage:
        condition: service_started
      storage-init:
        condition: service_completed_successfully
    # The local stand-in for R2 below, by service name as `DATABASE_URL` is in compose.yaml, so
    # `make start` needs no new `.env` key. The non-secret values match `.env.example`
    # (tests/ops/test_compose_dev_storage.py).
    environment:
      OBJECT_STORAGE_ENDPOINT: http://storage:7070
      OBJECT_STORAGE_REGION: auto
      OBJECT_STORAGE_ACCESS_KEY_ID: ai_trainer_dev
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ai_trainer_dev_secret
      OBJECT_STORAGE_UPLOADS_BUCKET: ai-trainer-uploads
      OBJECT_STORAGE_MEDIA_BUCKET: ai-trainer-media
      MEDIA_PUBLIC_BASE_URL: http://localhost:7070/ai-trainer-media
    # `LLM_DEBUG_LOG=true` writes to /app/.llm-debug (ADR-0018, #178); the bind mount puts
    # those lines on the host, where `jq . .llm-debug/*.jsonl` reads them. Write-only from the
    # container, so none of the bind-mount file-watching trouble above applies. Never in
    # compose.yaml: `make up`, CI and production get no such folder.
    volumes:
      - ./.llm-debug:/app/.llm-debug
    develop:
      watch:
        # Covers both Python routes and Jinja templates: both live under src/ai_trainer/.
        # No `watchfiles` package is locked, so Uvicorn's fallback reloader only polls *.py
        # mtimes — a template-only change never restarts the process; Jinja's own
        # auto_reload (the jinja2.Environment default, never overridden in templating.py)
        # picks up the edited template on the next request instead.
        - action: sync
          path: ./src
          target: /app/src
          ignore:
            - "**/__pycache__"
            - "*.pyc"
        # A dependency change needs a fresh image (`uv sync --locked` runs at build time,
        # ADR-0002), so rebuild rather than sync when either file changes.
        - action: rebuild
          path: ./uv.lock
        - action: rebuild
          path: ./pyproject.toml

  # The ingest worker against the same local bucket as `app` (#462), so an upload at
  # /admin/knowledge reaches `ingested` with no command typed. The worker has no reload, so a
  # synced change restarts it (`sync+restart`). Kept identical to `app`'s storage block
  # (tests/ops/test_compose_ingest.py).
  ingest:
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage:
        condition: service_started
    environment:
      OBJECT_STORAGE_ENDPOINT: http://storage:7070
      OBJECT_STORAGE_REGION: auto
      OBJECT_STORAGE_ACCESS_KEY_ID: ai_trainer_dev
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ai_trainer_dev_secret
      OBJECT_STORAGE_UPLOADS_BUCKET: ai-trainer-uploads
      OBJECT_STORAGE_MEDIA_BUCKET: ai-trainer-media
      MEDIA_PUBLIC_BASE_URL: http://localhost:7070/ai-trainer-media
    develop:
      watch:
        - action: sync+restart
          path: ./src
          target: /app/src
          ignore:
            - "**/__pycache__"
            - "*.pyc"
        - action: rebuild
          path: ./uv.lock
        - action: rebuild
          path: ./pyproject.toml

  # One-shot: brings the schema to head before `app` starts (#64), so a fresh clone or a
  # newly pulled migration never serves against a stale schema. `alembic upgrade head` is
  # idempotent — already-at-head is a fast no-op, matching `app`'s image (same build) and
  # the same `db`-hostname `DATABASE_URL` override, and needs `env_file: .env` too since
  # `migrations/env.py` constructs a full `Settings()`, which requires OPENROUTER_API_KEY
  # and EVAL_JUDGE_MODEL even though this command never touches either. Runs the venv's own
  # `alembic` binary directly, not `uv run` — ADR-0002's non-root-venv gotcha (a re-sync
  # against the root-owned .venv fails for the nonroot runtime user) applies to any command
  # in this image, not just the app's own CMD.
  migrate:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://ai_trainer:ai_trainer@db:5432/${APP_DB_NAME:-ai_trainer}
    depends_on:
      db:
        condition: service_healthy
    command:
      - alembic
      - upgrade
      - head

  # Local S3-compatible storage, so development needs no R2 account (ADR-0033, #420). It checks
  # signatures and link expiry as R2 does. A bucket is a directory on its posix backend, so
  # `mkdir` is all the setup it needs. `--region auto` is R2's region name: it refuses any other
  # than its own. Only on this machine's loopback, with dev-only keys, like `db`.
  storage:
    image: versity/versitygw:v1.10.0@sha256:89cad13cc981986ee284cbafea4613f9533ce6fd5f37a2c96c4c4fb8adb3a316
    entrypoint:
      - sh
      - -c
      - >-
        mkdir -p /data/ai-trainer-uploads /data/ai-trainer-media &&
        exec versitygw --port :7070 --access ai_trainer_dev --secret ai_trainer_dev_secret
        --region auto posix /data
    ports:
      - "127.0.0.1:7070:7070"
    volumes:
      - storage_data:/data

  # One-shot (#553): makes the media bucket readable without credentials, as R2's custom domain
  # does in production (ADR-0031), and only that bucket: `uploads` stays private. versitygw sets a
  # bucket ACL only through the S3 API, signed, and its image has no client, hence this one. The
  # ACL lives in the bucket's xattrs in `storage_data`, so a re-run changes nothing. Retries up
  # to 60 times while the gateway starts, then fails, so a stuck stack shows its error.
  storage-init:
    image: amazon/aws-cli:2.27.50@sha256:48c3d4212e2f5b0e24bdc6af7708f9412ce65425a79575e0f78b8f8c0dcd70ab
    entrypoint:
      - sh
      - -c
      - >-
        for attempt in $$(seq 1 60); do
        aws --endpoint-url http://storage:7070 s3api put-bucket-acl
        --bucket ai-trainer-media --acl public-read && exit 0; sleep 1; done;
        echo "storage-init: could not set the media bucket ACL after 60 tries" >&2; exit 1
    environment:
      AWS_ACCESS_KEY_ID: ai_trainer_dev
      AWS_SECRET_ACCESS_KEY: ai_trainer_dev_secret
      AWS_DEFAULT_REGION: auto
    depends_on:
      storage:
        condition: service_started
    restart: "no"

volumes:
  storage_data:
