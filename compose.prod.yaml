# The production stack (ADR-0023, ticket #221): Postgres, a one-shot `migrate`, the app, Caddy
# and Grafana Alloy (ADR-0030, ticket #272). Only Caddy publishes a port (443); it accepts only
# Cloudflare's Authenticated Origin Pulls client certificate and proxies to `app:8000` over the
# `edge` network.
#
# Run from the directory that holds this file and `deploy/Caddyfile`. Everything secret comes
# from CONFIG_DIR (default `.`, i.e. /opt/ai-trainer on the server), never from the repo or image:
#   .env    the app's Settings (DATABASE_URL carries the database password)
#   db.env  POSTGRES_PASSWORD only — a separate file, so .env keeps a strict 1:1 match with
#           Settings (tests/unit/test_settings.py)
#   certs/  origin.pem + origin-key.pem (Cloudflare Origin CA) and aop-ca.pem (the zone's AOP CA)
#   alloy.env  Grafana Cloud URLs, users and token, read by `alloy` only (deploy/alloy.env.example)
# APP_IMAGE is `ghcr.io/stanislawk/ai-trainer@sha256:<digest>` in production; the README's local
# smoke run passes a locally built tag instead, since a local build has no registry digest.
#
# Its own project name: compose.yaml's project is `ai-trainer`, so without one an `up` here would
# replace the `make start` containers.
name: ai-trainer-prod

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  db:
    <<: *hardening
    image: pgvector/pgvector:pg18-trixie@sha256:9d9c930220cb9bf2f956d10a8f909cf9973d9672ca0278aef2c1e6facccad2e0
    restart: unless-stopped
    env_file:
      - ${CONFIG_DIR:-.}/db.env
    environment:
      POSTGRES_USER: ai_trainer
      POSTGRES_DB: ai_trainer
    # The entrypoint starts as root to own the data directory, then drops to `postgres` with gosu.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    volumes:
      # pg 18+ mounts the parent dir; PGDATA lives at a pg_ctlcluster-style subpath.
      - postgres_data:/var/lib/postgresql
    # ADR-0004: at least maintenance_work_mem, so parallel HNSW index builds don't fail.
    shm_size: "256mb"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_trainer -d ai_trainer"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 1g

  # One-shot, as in compose.dev.yaml (#64): brings the schema to head, exits, and only then does
  # `app` start. Never restarted: deploy.sh runs it once per release, after the backup.
  migrate:
    <<: *hardening
    image: ${APP_IMAGE:?set APP_IMAGE to ghcr.io/stanislawk/ai-trainer@sha256:<digest>}
    restart: "no"
    env_file:
      - ${CONFIG_DIR:-.}/.env
    environment:
      # As for `app` below: a Grafana credential left in .env never reaches the process.
      OTEL_EXPORTER_OTLP_HEADERS: ""
      OTEL_EXPORTER_OTLP_TRACES_HEADERS: ""
      OTEL_EXPORTER_OTLP_METRICS_HEADERS: ""
      OTEL_EXPORTER_OTLP_LOGS_HEADERS: ""
    command:
      - alembic
      - upgrade
      - head
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 512m

  app:
    <<: *hardening
    image: ${APP_IMAGE:?set APP_IMAGE to ghcr.io/stanislawk/ai-trainer@sha256:<digest>}
    restart: unless-stopped
    env_file:
      - ${CONFIG_DIR:-.}/.env
    environment:
      # The Dockerfile's CMD runs Uvicorn with --proxy-headers; Uvicorn reads this variable and
      # trusts X-Forwarded-* only from the edge subnet, where Caddy is the only other member.
      FORWARDED_ALLOW_IPS: 10.221.0.0/24
      # JSON lines with trace, request and user IDs for Alloy to ship (ADR-0030).
      LOG_FORMAT: json
      # Traces go to Alloy on `telemetry`; an unreachable Alloy never fails a request.
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      # Alloy alone holds the Grafana Cloud credentials (ADR-0030 invariant 1): these override
      # any header left in .env, so it never reaches the process. The OTel SDK reads the
      # per-signal ones itself, whatever headers the app passes.
      OTEL_EXPORTER_OTLP_HEADERS: ""
      OTEL_EXPORTER_OTLP_TRACES_HEADERS: ""
      OTEL_EXPORTER_OTLP_METRICS_HEADERS: ""
      OTEL_EXPORTER_OTLP_LOGS_HEADERS: ""
      # Each span's `service.version` and `deployment.environment` (#293). deploy.sh passes the
      # release tag as RELEASE_TAG; any other `up` reports `unknown`. Not APP_VERSION: Compose
      # also interpolates from the project directory's .env, the app's own, where it reads `dev`.
      APP_VERSION: ${RELEASE_TAG:-unknown}
      DEPLOYMENT_ENVIRONMENT: production
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # `edge` for Caddy and outbound calls (OpenRouter, Google), `backend` for Postgres,
    # `telemetry` for Alloy.
    networks:
      - edge
      - backend
      - telemetry
    deploy:
      resources:
        limits:
          memory: 1g

  caddy:
    <<: *hardening
    image: caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    restart: unless-stopped
    ports:
      - "443:443"
    # The image grants the binary this capability as a file capability, which no-new-privileges
    # blocks; Caddy runs as root, so the bounding set has to carry it instead.
    cap_add:
      - NET_BIND_SERVICE
    environment:
      # The host of PUBLIC_BASE_URL; the Origin CA certificate's SAN must match it.
      SITE_HOST: ${SITE_HOST:?set SITE_HOST to the host of PUBLIC_BASE_URL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${CONFIG_DIR:-.}/certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    # `edge` for the app. `metrics` for Alloy alone: Caddy serves its Prometheus metrics only on
    # this fixed address (deploy/Caddyfile), never through 443. A network of its own, not
    # `telemetry`: sharing two networks with the app, Docker's DNS could answer `app` with its
    # telemetry address, from which Uvicorn doesn't trust X-Forwarded-* (ADR-0030, #273).
    networks:
      edge: {}
      metrics:
        ipv4_address: 10.222.0.10
    deploy:
      resources:
        limits:
          memory: 256m

  # Relays the app's OTLP, this project's container logs and the host's, Caddy's and Postgres'
  # metrics to Grafana Cloud (ADR-0030). It
  # publishes no port and is never on `edge`, whose subnet the app trusts for X-Forwarded-*.
  # Nothing depends on it, and its env file is optional: without credentials Alloy can't build
  # its exporters and restarts in a loop, shipping nothing, but the rest of the stack starts and
  # serves (ADR-0030 invariant 5).
  alloy:
    <<: *hardening
    image: grafana/alloy:v1.20.1@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
    restart: unless-stopped
    env_file:
      - path: ${CONFIG_DIR:-.}/alloy.env
        required: false
    command:
      - run
      - /etc/alloy/config.alloy
      # The image's /var/lib/alloy belongs to its `alloy` user (mode 770), which root can't enter
      # without DAC_OVERRIDE; a path the image doesn't have is created root-owned instead.
      - --storage.path=/data
      - --disable-reporting
    # The image runs as root, which owns the Docker socket, so no capability is added back. The
    # Docker API is root-equivalent even read-only: Alloy listens only on `telemetry`.
    volumes:
      - ./deploy/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # The host journal for the scheduled jobs' outcome lines (ADR-0030, #274): persistent
      # storage under /var/log/journal, the volatile one under /run/log/journal, and the machine
      # ID the journal files are named by.
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      # The host's own /proc, /sys and root filesystem for prometheus.exporter.unix (#273):
      # without them it reports this container rather than the VPS. `rslave` lets mounts made on
      # the host after start show up here.
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
      - alloy_data:/data
    # `telemetry` for the app's OTLP, `backend` for Postgres' statistics (as the pg_monitor role
    # only), `metrics` for Caddy's, and `egress` to Grafana Cloud. Its fixed address on `metrics`
    # is the only one Caddy serves its metrics to (deploy/Caddyfile).
    networks:
      telemetry: {}
      backend: {}
      metrics:
        ipv4_address: 10.222.0.20
      egress: {}
    deploy:
      resources:
        limits:
          memory: 256m

networks:
  edge:
    ipam:
      config:
        - subnet: 10.221.0.0/24
  # No route out: Postgres talks only to `migrate`, `app` and Alloy's exporter.
  backend:
    internal: true
  # No route out: the app reaches Alloy here and nothing else.
  telemetry:
    internal: true
  # No route out: Alloy scrapes Caddy's metrics here and nothing else (#273).
  metrics:
    internal: true
    ipam:
      config:
        - subnet: 10.222.0.0/24
  # Alloy's own way out, to Grafana Cloud.
  egress:
    driver: bridge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  alloy_data:
