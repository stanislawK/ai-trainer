package_update: true
package_upgrade: true
# Docker comes from Debian's own archive, so Debian-Security patches it and unattended-upgrades
# applies the patches. Trixie ships compose v2 as the `docker compose` plugin.
packages:
  - sudo
  - unattended-upgrades
  - docker.io
  - docker-cli
  - docker-compose
  # deploy/backup.sh: age encrypts the dump to the owner's key, rclone uploads it to R2 (#223).
  - age
  - rclone
  # deploy/deploy.sh (#225): gh reads the deployments and verifies the image's provenance, curl
  # polls /health, flock (util-linux) keeps one run at a time.
  - gh
  - curl
  - util-linux

write_files:
  # sshd keeps the first value it reads, and Debian includes sshd_config.d/ at the top of
  # sshd_config, so this file wins over cloud-init's own 50-cloud-init.conf and anything below.
  - path: /etc/ssh/sshd_config.d/10-ai-trainer.conf
    owner: root:root
    permissions: "0644"
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      AuthenticationMethods publickey
      AllowUsers deploy
  # Written after the packages are installed, so the package's own setup can't replace it.
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root:root
    permissions: "0644"
    defer: true
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
  # Unattended-upgrades follows only Debian's origins by default; this adds GitHub CLI's
  # repository (Origin and Label `gh`), so gh is kept current like the rest (#225).
  - path: /etc/apt/apt.conf.d/52ai-trainer-unattended-upgrades
    owner: root:root
    permissions: "0644"
    defer: true
    content: |
      Unattended-Upgrade::Origins-Pattern {
        "origin=gh,label=gh";
      };

# runcmd runs after the packages are installed, so the docker group exists by then.
runcmd:
  - [usermod, -aG, docker, deploy]
  - [install, -d, -o, deploy, -g, deploy, -m, "0750", /opt/ai-trainer]
  # Caddy runs with every capability dropped and reads its keys as root (ADR-0023, #221 gotchas).
  - [install, -d, -o, root, -g, root, -m, "0700", /opt/ai-trainer/certs]
  - [systemctl, enable, --now, docker, unattended-upgrades]

# One reboot once everything has run, so sshd, the kernel and the group membership take effect.
power_state:
  mode: reboot
  message: cloud-init finished; rebooting once
  timeout: 30
