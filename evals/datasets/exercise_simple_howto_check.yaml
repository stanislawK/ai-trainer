# Dataset for the exercise_simple_howto_check decision (ADR-0020 invariant 6, ADR-0031 *Jev check*,
# #591): code-graded, at least 20 cases because the check guards safety and form cues. Each case's
# state (`prompt`) is exactly what the app sends Jev: `HowtoCheckState(original, summary)` as JSON;
# `deps` repeats the two texts for reading, and a unit test keeps them in step.
# The originals are the catalogue instructions quoted in evals/smoke/exercise.simple_howto.yaml,
# copied verbatim (pinned dataset commit 7455efae). The summaries are written by hand. `metadata.kind`
# names each case's kind: `good` (faithful), or broken by a `dropped_cue`, an `added_cue`, a
# `changed_number` (added or changed) or `another_movement` (mostly the lateral-raise family). The
# labels are P(yes) at EXERCISE_SIMPLE_HOWTO_CHECK_THRESHOLD: both questions are phrased so that
# "yes" is good, and a summary passes only when both are true.
name: exercise_simple_howto_check
cases:
- name: 'dumbbell lateral raise: good'
  metadata:
    kind: good
    exercise: Dumbbell Lateral Raise
    instructions_source: exercises-dataset 0334
  inputs:
    prompt: '{"original":"Stand with your feet shoulder-width apart and hold a dumbbell in each hand,
      palms facing your body. Keep your back straight and engage your core. Raise your arms out to the
      sides until they are parallel to the floor, keeping a slight bend in your elbows. Pause for a moment
      at the top, then slowly lower your arms back down to the starting position. Repeat for the desired
      number of repetitions.","summary":"Hold a dumbbell in each hand, back straight and core tight. Raise
      your arms out to the sides to shoulder height, elbows slightly bent, then lower slowly."}'
    deps:
      original: Stand with your feet shoulder-width apart and hold a dumbbell in each hand, palms facing
        your body. Keep your back straight and engage your core. Raise your arms out to the sides until
        they are parallel to the floor, keeping a slight bend in your elbows. Pause for a moment at the
        top, then slowly lower your arms back down to the starting position. Repeat for the desired number
        of repetitions.
      summary: Hold a dumbbell in each hand, back straight and core tight. Raise your arms out to the
        sides to shoulder height, elbows slightly bent, then lower slowly.
  expected_output:
    keeps_cues: true
    adds_nothing: true
- name: 'dumbbell lateral raise: good, other wording'
  metadata:
    kind: good
    exercise: Dumbbell Lateral Raise
    instructions_source: exercises-dataset 0334
  inputs:
