# Dataset for the goal_kind decision (ADR-0020 invariant 6, ADR-0028 #618 amendment, PRD 0013 B45,
# #625): code-graded, labelled before the threshold is set (ADR-0034). Each case is one onboarding
# goal as `onboarding.goals` writes it: a short line in the athlete's words. Its state (`prompt`)
# is exactly what the app sends Jev, `GoalKindState(goal)` as JSON; `deps` repeats the goal for
# reading, and a unit test keeps them in step. `kind` is the option Jev should pick: one of the six
# kinds, or `none` when the goal names no outcome a kind could serve. At least two cases per kind,
# Polish ones, two near-ties labelled by the outcome the goal leads with (`metadata.near_tie`), and
# the `none` case. `metadata.source` says where each goal came from: the ticket's ACs,
# evals/datasets/onboarding.goals.yaml, or written by hand.
name: goal_kind
cases:
- name: 'strength: Deadlift 150 kg'
  metadata:
    source: 'ticket #625 AC; onboarding.goals dataset'
  inputs:
    prompt: '{"goal":"Deadlift 150 kg"}'
    deps:
      goal: Deadlift 150 kg
  expected_output:
    kind: strength
- name: 'strength: Squat 120 kg'
  metadata:
    source: onboarding.goals dataset
  inputs:
    prompt: '{"goal":"Squat 120 kg"}'
    deps:
      goal: Squat 120 kg
  expected_output:
    kind: strength
- name: 'strength: Pull-up with +10 kg'
  metadata:
