    limits: null
- name: 'units: a bare height and weight read as cm and kg'
  inputs:
    prompt: 31, 178, 72
    deps:
      sport: climbing
      today: '2026-10-24'
      timezone: Europe/Warsaw
  metadata: null
  expected_output:
    age: 31
