# Dataset for the picture_brief_check decision (ADR-0020 invariant 6, ADR-0031 *Picture on the
# card*, #642): code-graded, at least 20 cases, labelled before the thresholds are set (ADR-0034).
# Each case's state (`prompt`) is exactly what the app sends Jev: `BriefCheckState(instructions,
# brief)` as JSON; `deps` repeats the two texts for reading, and a unit test keeps them in step.
# The instructions are the catalogue texts quoted in evals/smoke/media.picture_brief.yaml and
# evals/smoke/exercise.simple_howto.yaml, copied verbatim (pinned dataset commit 7455efae; Face
# Pull from data/catalogue/extra.yaml). The briefs are written by hand. `metadata.kind` names each
# case's kind: `good`, or broken by `another_movement` (a near neighbour), `labels` (printed text
# asked for), `two_figures` or `no_positions` (one position only). The labels are P(yes) at each
# question's own threshold (PICTURE_BRIEF_CHECK_MOVEMENT_THRESHOLD for same_movement,
# PICTURE_BRIEF_CHECK_RULES_THRESHOLD for keeps_rules): both questions are phrased so that "yes"
# is good, and a brief is drawn only when both are true.
name: picture_brief_check
cases:
- name: 'pull-up: good'
  metadata:
    kind: good
    exercise: Pull-Up
    instructions_source: exercises-dataset 0652
  inputs:
    prompt: '{"instructions":"Hang from a pull-up bar with your palms facing away from you and your arms
      fully extended. Engage your core and squeeze your shoulder blades together. Pull your body up towards
      the bar by bending your elbows and bringing your chest towards the bar. Pause at the top of the
      movement, then slowly lower your body back down to the starting position. Repeat for the desired
      number of repetitions.","brief":"One person hanging from a pull-up bar, palms facing away and arms
      fully extended, then with the chest at the bar and elbows bent. Plain background. No text, letters,
      numbers, labels or arrows in the picture."}'
    deps:
      instructions: Hang from a pull-up bar with your palms facing away from you and your arms fully extended.
        Engage your core and squeeze your shoulder blades together. Pull your body up towards the bar
        by bending your elbows and bringing your chest towards the bar. Pause at the top of the movement,
        then slowly lower your body back down to the starting position. Repeat for the desired number
        of repetitions.
      brief: One person hanging from a pull-up bar, palms facing away and arms fully extended, then with
        the chest at the bar and elbows bent. Plain background. No text, letters, numbers, labels or arrows
        in the picture.
  expected_output:
    same_movement: true
    keeps_rules: true
