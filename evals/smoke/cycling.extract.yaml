# Smoke set for cycling.extract (ADR-0034, #374): 5 cases taken from
# evals/datasets/cycling.extract.yaml, named in each case's `metadata.dataset`, until real chats
# arrive in evals/field/, plus #619's two below (7 cases). Graded in code, run once, no judge.
name: cycling.extract
cases:
- name: 'relative: 62 km with 800 m this morning (AC)'
  inputs:
    prompt: Rode 62 km with 800 m climbing this morning
    deps:
      message: Rode 62 km with 800 m climbing this morning
      history: []
      today: '2026-10-13'
      weekday: Tuesday
      now_local: '2026-10-13T19:00:00+02:00'
      timezone: Europe/Warsaw
  metadata:
    dataset: evals/datasets/cycling.extract.yaml
  expected_output:
    occurred_on: '2026-10-13'
    date_source: relative
    activities:
    - distance:
        original: 62 km
        value: 62
        unit: km
      moving_time_min: null
      elevation:
        original: 800 m
        value: 800
        unit: m
      zones: []
- name: 'units: decimal distance'
  inputs:
    prompt: Did 25.5 km on the gravel bike
    deps:
      message: Did 25.5 km on the gravel bike
      history: []
      today: '2026-10-13'
      weekday: Tuesday
      now_local: '2026-10-13T19:00:00+02:00'
      timezone: Europe/Warsaw
  metadata:
    dataset: evals/datasets/cycling.extract.yaml
  expected_output:
    occurred_on: '2026-10-13'
    date_source: assumed_today
    activities:
    - distance:
        original: 25.5 km
        value: 25.5
        unit: km
      moving_time_min: null
      elevation: null
      zones: []
- name: 'units: a ridden number without a unit is a distance with no unit (#206)'
  inputs:
    prompt: Rode 60 today
    deps:
      message: Rode 60 today
      history: []
      today: '2026-10-13'
      weekday: Tuesday
      now_local: '2026-10-13T19:00:00+02:00'
      timezone: Europe/Warsaw
  metadata:
    dataset: evals/datasets/cycling.extract.yaml
  expected_output:
    occurred_on: '2026-10-13'
    date_source: relative
    activities:
    - distance:
        original: '60'
        value: 60
        unit: null
      moving_time_min: null
      elevation: null
      zones: []
- name: 'zones: easy is not a zone'
  inputs:
    prompt: Easy spin for an hour
    deps:
      message: Easy spin for an hour
      history: []
      today: '2026-10-13'
      weekday: Tuesday
      now_local: '2026-10-13T19:00:00+02:00'
      timezone: Europe/Warsaw
  metadata:
    dataset: evals/datasets/cycling.extract.yaml
  expected_output:
    occurred_on: '2026-10-13'
    date_source: assumed_today
    activities:
    - distance: null
      moving_time_min: 60
      elevation: null
      zones: []
- name: 'reading: km and mi rides, a bare 40 asks (AC)'
  inputs:
    prompt: Rode 40
    deps:
      message: Rode 40
      history: []
      today: '2026-10-13'
      weekday: Tuesday
      now_local: '2026-10-13T19:00:00+02:00'
      timezone: Europe/Warsaw
      recent:
      - km
      - mi
  metadata:
    dataset: evals/datasets/cycling.extract.yaml
  expected_output:
    distance: '40'
    readings:
    - km
    - mi
# #619: a reported bug with no field transcript. Rower work is gym, so only the ride is drafted.
- name: 'other sports: the rower is left to gym (#619)'
  inputs:
    prompt: Rode 30 km outside, then 5 km on the rower
    deps:
      message: Rode 30 km outside, then 5 km on the rower
      history: []
      today: '2026-11-23'
      weekday: Monday
      now_local: '2026-11-23T19:00:00+01:00'
      timezone: Europe/Warsaw
  metadata:
    ticket: 619
    synthetic: reported bug
  expected_output:
    occurred_on: '2026-11-23'
    date_source: assumed_today
    activities:
    - distance:
        original: 30 km
        value: 30
        unit: km
      moving_time_min: null
      elevation: null
      zones: []
- name: 'other sports: a home trainer ride is still cycling (#619)'
  inputs:
    prompt: 1:30 on the trainer, Z2
    deps:
      message: 1:30 on the trainer, Z2
      history: []
      today: '2026-11-23'
      weekday: Monday
      now_local: '2026-11-23T19:00:00+01:00'
      timezone: Europe/Warsaw
  metadata:
    ticket: 619
    synthetic: reported bug
    source: "#619 code review: a home trainer is cycling, not an indoor machine"
  expected_output:
    occurred_on: '2026-11-23'
    date_source: assumed_today
    activities:
    - distance: null
      moving_time_min: 90
      elevation: null
      zones:
      - zone: 2
        minutes: 90
evaluators:
- DateMatch
- ActivitiesMatch
- QuestionMatch
