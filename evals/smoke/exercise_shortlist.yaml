# Smoke set for the exercise_shortlist decision (ADR-0034, #399): 10 pick cases (5 of them wger's
# names for the picture import, #555, described above their block), graded in code, run
# once on Jev. Each case is a typed gym name and the shortlist the app would offer; `pick` is the
# candidate's name when the app should fill the exercise with no card, or `none` when the card
# should ask (Jev says none, is torn between two, or is below the Settings threshold).
# Names 3-5 are cut from evals/field/gym/2026-10-28-first-gym-session.md; the candidates are
# catalogue names (ADR-0031). There is no judge: a decision is graded by its outcome.
#
# The last four cases are `live` (#429): no candidates and no Jev call. They ask the app's own
# shortlist, on the imported catalogue, for the typed name and the entry's `measure` (default
# `load_reps`) and pass when `listed` is among its candidates, so they score the shortlist's
# recall. The search is on by default since #508; run the set with EXERCISE_SEARCH_ENABLED false
# too to compare. They need `uv run ai-trainer import-exercises`, for the search also an ingest
# (`make ingest-once`), and an active admin in ADMIN_EMAILS.
name: exercise_shortlist
# Measured at #508 (2026-11-07): 3 of 4 live cases pass with the search on, 2 of 4 with it off
# (at #429: 2 of 4 both ways). "Rising straight arms" lists Dumbbell Lateral Raise 3rd, as the
# search leads for a name no catalogue name matches and each chunk carries its target and
# equipment. The triceps paraphrase still misses: the rope pushdown isn't in the search's top 60,
# below every triceps extension (ADR-0031's #508 amendment). With the search off, "rising straight
# arms" misses too.
known_gaps:
  live triceps arm bent to 90: "#508"
cases:
- name: pull ups
  metadata:
    source: evals/field/gym/2026-10-28-first-gym-session.md
  inputs:
    prompt: Pull ups
    deps:
      candidates:
      - {name: Pull-up, equipment: body weight, target: lats}
      - {name: Chin-up, equipment: body weight, target: biceps}
      - {name: Band Assisted Pull-up, equipment: band, target: lats}
  expected_output:
    pick: Pull-up
- name: polish squat
  metadata:
    source: Polish names are best effort until M3 (ADR-0031); an easy case in another language
  inputs:
    prompt: przysiad ze sztangą
    deps:
      candidates:
      - {name: Barbell Squat, equipment: barbell, target: glutes}
      - {name: Dumbbell Squat, equipment: dumbbell, target: glutes}
  expected_output:
    pick: Barbell Squat
- name: bench press fits two
  metadata:
    source: evals/field/gym/2026-10-28-first-gym-session.md
  inputs:
    prompt: Bench press
    deps:
      candidates:
      - {name: Barbell Bench Press, equipment: barbell, target: pectorals}
      - {name: Dumbbell Bench Press, equipment: dumbbell, target: pectorals}
      - {name: Smith Machine Bench Press, equipment: leverage machine, target: pectorals}
  expected_output:
    pick: none
- name: rising straight arms
  metadata:
    source: evals/field/gym/2026-10-28-first-gym-session.md
  inputs:
    prompt: rising straight arms on both sides
    deps:
      candidates:
      - {name: Dumbbell Lateral Raise, equipment: dumbbell, target: delts}
      - {name: Dumbbell Front Raise, equipment: dumbbell, target: delts}
      - {name: Cable Standing Rear Delt Row, equipment: cable, target: delts}
  expected_output:
    pick: none
- name: triceps arm bent to 90
  metadata:
    source: evals/field/gym/2026-10-28-first-gym-session.md
  inputs:
    prompt: Triceps - straightening arm bent to 90 degr
    deps:
      candidates:
      - {name: Triceps Dip, equipment: body weight, target: triceps}
      - {name: Close-Grip Bench Press, equipment: barbell, target: triceps}
  expected_output:
    pick: none
# wger's English names for the picture import (#555): the candidates are the catalogue-only
# trigram shortlist the import asks Jev about (EXERCISE_CANDIDATE_FLOOR 0.25, at most 4, best
# first), recorded on the imported catalogue on 2026-11-11. A pick links the picture, so "none"
# is the answer whenever the name doesn't settle one exercise.
- name: wger dumbbell shrugs
  metadata:
    source: wger exercise 572
    note: >-
      the name doesn't say flat, incline or decline, so no variant is clearly the one; relabelled
      from Dumbbell Shrug to none by the owner at #555 after Jev abstained (an unmatched picture
      costs nothing, a wrong link costs an admin's rejection)
  inputs:
    prompt: Shrugs, Dumbbells
    deps:
      candidates:
      - {name: Dumbbell Shrug, equipment: dumbbell, target: traps}
      - {name: Dumbbell Decline Shrug, equipment: dumbbell, target: traps}
      - {name: Dumbbell Incline Shrug, equipment: dumbbell, target: traps}
      - {name: Dumbbell Decline Shrug v. 2, equipment: dumbbell, target: traps}
  expected_output:
    pick: none
- name: wger barbell biceps curls
  metadata:
    source: wger exercise 91
    note: the right exercise is 4th; the trigram top is the arm-blaster variant
  inputs:
    prompt: Biceps Curls With Barbell
    deps:
      candidates:
      - {name: Barbell Biceps Curl (With Arm Blaster), equipment: barbell, target: biceps}
      - {name: Barbell Alternate Biceps Curl, equipment: barbell, target: biceps}
      - {name: Barbell Standing Wide Grip Biceps Curl, equipment: barbell, target: biceps}
      - {name: Barbell Curl, equipment: barbell, target: biceps}
  expected_output:
    pick: Barbell Curl
- name: wger bench press
  metadata:
    source: wger exercise 73
    note: a near tie, four bench presses by equipment
  inputs:
    prompt: Bench Press
    deps:
      candidates:
      - {name: Band Bench Press, equipment: band, target: pectorals}
      - {name: Cable Bench Press, equipment: cable, target: pectorals}
      - {name: Smith Bench Press, equipment: smith machine, target: pectorals}
      - {name: Barbell Bench Press, equipment: barbell, target: pectorals}
  expected_output:
    pick: none
- name: wger butterfly
  metadata:
    source: wger exercise 135
    note: the pec deck; no candidate is it, and the trigram top is a yoga pose
  inputs:
    prompt: Butterfly
    deps:
      candidates:
      - {name: Butterfly Yoga Pose, equipment: body weight, target: adductors}
      - {name: Butt-Ups, equipment: body weight, target: abs}
  expected_output:
    pick: none
- name: wger bench press narrow grip
  metadata:
    source: wger exercise 76
    note: the trigram top is the wide grip; three close-grip presses differ only by equipment
  inputs:
    prompt: Bench Press Narrow Grip
    deps:
      candidates:
      - {name: Smith Wide Grip Bench Press, equipment: smith machine, target: pectorals}
      - {name: EZ-Bar Close-Grip Bench Press, equipment: ez barbell, target: triceps}
      - {name: Smith Close-Grip Bench Press, equipment: smith machine, target: triceps}
      - {name: Barbell Close-Grip Bench Press, equipment: barbell, target: triceps}
  expected_output:
    pick: none
- name: live rising straight arms
  metadata:
    source: evals/field/gym/2026-10-28-first-gym-session.md
    note: the case ADR-0031 records as ranking 178th by trigram (#402, #429)
  inputs:
    prompt: rising straight arms on both sides
    deps: {live: true}
  expected_output:
    listed: Dumbbell Lateral Raise
- name: live triceps arm bent to 90
  metadata:
    source: evals/field/gym/2026-10-28-first-gym-session.md
    note: the owner's rope pushdown ("Rope Tricep Extension", "Cable Rope Triceps Pushdown"), confirmed at #508's plan gate; #429 had read it as a kickback
  inputs:
    prompt: Triceps - straightening arm bent to 90 degr
    deps: {live: true}
  expected_output:
    listed: Cable Pushdown (With Rope Attachment)
- name: live pull ups
  metadata:
    source: evals/field/gym/2026-10-28-first-gym-session.md
  inputs:
    prompt: Pull ups
    deps: {live: true, measure: reps}  # "Gym 8 pull ups 3x": reps only, no load
  expected_output:
    listed: Pull-Up
- name: live face pull
  metadata:
    source: evals/field/gym/2026-10-28-first-gym-session.md
  inputs:
    prompt: Face pull
    deps: {live: true}
  expected_output:
    listed: Face Pull
