# Smoke set for the goal_kind decision (ADR-0034, #625): graded in code, run once on Jev. There is
# no field transcript of onboarding goals (evals/field/ holds a gym session only), so the cases are
# cut from evals/datasets/goal_kind.yaml: the ticket's three ACs, a near-tie, the `none` case, an
# endurance goal and a Polish one. Each case's deps are the goal the app sends as the state; `kind`
# is what the app should store at GOAL_KIND_THRESHOLD through its own `confident_kind`, so an
# expected `none` also passes when Jev's pick falls below it. A wrong kind is seen and fixed on the
# summary; a missing one costs an empty pick.
name: goal_kind
cases:
- name: 'strength: Deadlift 150 kg'
  inputs:
    prompt: Deadlift 150 kg
    deps:
      goal: Deadlift 150 kg
  expected_output:
    kind: strength
- name: 'endurance: Run 10 km under 50 minutes'
  inputs:
    prompt: Run 10 km under 50 minutes
    deps:
      goal: Run 10 km under 50 minutes
  expected_output:
    kind: endurance
- name: 'weight_loss: Lose 5 kg'
  inputs:
    prompt: Lose 5 kg
    deps:
      goal: Lose 5 kg
  expected_output:
    kind: weight_loss
- name: 'weight_loss: Schudnąć 8 kg'
  inputs:
    prompt: Schudnąć 8 kg
    deps:
      goal: Schudnąć 8 kg
  expected_output:
    kind: weight_loss
- name: 'mobility: Touch my toes by summer'
  inputs:
    prompt: Touch my toes by summer
    deps:
      goal: Touch my toes by summer
  expected_output:
    kind: mobility
- name: 'general_fitness: Get fitter and lose a bit of weight'
  inputs:
    prompt: Get fitter and lose a bit of weight
    deps:
      goal: Get fitter and lose a bit of weight
  expected_output:
    kind: general_fitness
- name: 'none: Have fun'
  inputs:
    prompt: Have fun
    deps:
      goal: Have fun
  expected_output:
    kind: none
