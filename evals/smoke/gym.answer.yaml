# Goals and limits (PRD 0013 B46, #629). No field chat carries a goal or a limit yet, so these
# questions are worded from B46 and B42's acceptance criteria (ADR-0034 #622 amendment) and stand
# apart from the ten above; their passages are synthetic (ADR-0034 #428 amendment).
- name: mobility focus, with a matching source
  metadata:
    prd: PRD 0013 B46, a mobility athlete's answer is framed to mobility and cites its source
    knowledge_source: synthetic
    knowledge:
    - title: Flexibility Training for Adults
      author: J. Physio
      evidence_tier: coaching_book
      source_type: book
      locator: {kind: page, page: 41}
      text: Adults working on hip range of motion should stretch the hip flexors and hamstrings
        two to three days a week, holding each stretch for 30 to 60 seconds.
    expect:
      called: [search_knowledge, cite_sources]
      cites: [Flexibility Training for Adults]
      mentions: ['mobility|range of motion', '\b(2|two)\b.{0,15}\b(3|three)\b']
  inputs:
    prompt: What should I focus on?
    deps: &mobility_deps
      message: What should I focus on?
      history: []
      today: '2026-11-24'
      now_local: '2026-11-24T18:30:00+01:00'
      timezone: Europe/Warsaw
      goals:
      - {text: Get more mobile in my hips, kind: mobility}
