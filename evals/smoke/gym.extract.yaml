# Smoke set for gym.extract (ADR-0034), cut from the owner's first gym session. Messages are
# verbatim, typos included. Exercise names are left open (`ignore_fields`): naming is code's job
# from M1g (ADR-0031). The plank, the red band rows and the two together are synthetic, from the
# gaps #395 reports (`metadata.reported`): the first session held no time and no "red band"
# wording. Those cases grade the name too, as a band's words must stay out of it.
name: gym.extract
cases:
- name: 'pull ups: reps before sets'
  inputs:
    prompt: Gym 8 pull ups 3x
    deps: &deps
      message: Gym 8 pull ups 3x
      history: []
      today: '2026-10-28'
      weekday: Wednesday
      now_local: '2026-10-28T20:49:00+01:00'
      timezone: Europe/Warsaw
  metadata:
    field: evals/field/gym/2026-10-28-first-gym-session.md
    ignore_fields: [name]
  expected_output:
    occurred_on: '2026-10-28'
    date_source: assumed_today
    activities:
    - name: pull ups
      sets: 3
      reps: 8
      load: null
      rir: null
- name: 'bench press: load, reps, then sets'
  inputs:
    prompt: Bench press 45kg 8 x3
    deps:
      <<: *deps
      message: Bench press 45kg 8 x3
  metadata:
    field: evals/field/gym/2026-10-28-first-gym-session.md
    ignore_fields: [name]
  expected_output:
    occurred_on: '2026-10-28'
    date_source: assumed_today
    activities:
    - name: Bench press
      sets: 3
      reps: 8
      load:
        original: 45kg
        value: 45
        unit: kg
      rir: null
- name: 'face pull: series means sets'
  inputs:
    prompt: Face pull 30kg 12reps 4 series
    deps:
      <<: *deps
      message: Face pull 30kg 12reps 4 series
  metadata:
    field: evals/field/gym/2026-10-28-first-gym-session.md
    ignore_fields: [name]
  expected_output:
    occurred_on: '2026-10-28'
    date_source: assumed_today
    activities:
    - name: Face pull
      sets: 4
      reps: 12
      load:
        original: 30kg
        value: 30
        unit: kg
      rir: null
- name: 'rising straight arms: no reps given, none invented'
  inputs:
    prompt: 4 series two hantles 6kg each - rising straight arms on both sides
    deps:
      <<: *deps
      message: 4 series two hantles 6kg each - rising straight arms on both sides
  metadata:
    field: evals/field/gym/2026-10-28-first-gym-session.md
    # "On both sides" with two dumbbells doesn't say whether a count is per side.
    ignore_fields: [name, per_side]
  expected_output:
    occurred_on: '2026-10-28'
    date_source: assumed_today
    activities:
    - name: rising straight arms
      sets: 4
      reps: null
      load:
        original: 6kg
        value: 6
        unit: kg
      implements: 2
      rir: null
- name: 'triceps: long name, series and reps'
  inputs:
    prompt: Triceps - straightening arm bent to 90 degr 3 series 10 reps 14kg
    deps:
      <<: *deps
      message: Triceps - straightening arm bent to 90 degr 3 series 10 reps 14kg
  metadata:
    field: evals/field/gym/2026-10-28-first-gym-session.md
    ignore_fields: [name]
  expected_output:
    occurred_on: '2026-10-28'
    date_source: assumed_today
    activities:
    - name: Triceps - straightening arm bent to 90 degr
      sets: 3
      reps: 10
      load:
        original: 14kg
        value: 14
        unit: kg
      rir: null
- name: 'anti rotations: a band is not a kg load'
  inputs:
    prompt: Anti rotations 12 reps each side - red bungee (elastic) tape
    deps:
      <<: *deps
      message: Anti rotations 12 reps each side - red bungee (elastic) tape
  metadata:
    field: evals/field/gym/2026-10-28-first-gym-session.md
    ignore_fields: [name]
  expected_output:
    occurred_on: '2026-10-28'
    date_source: assumed_today
    activities:
    - name: Anti rotations
      sets: null
      reps: 12
      load: null
      band: red
      per_side: true
      rir: null
- name: 'plank: time held per set'
  inputs:
    prompt: plank 3x45s
    deps:
      <<: *deps
      message: plank 3x45s
  metadata:
    reported: '#395'
  expected_output:
    occurred_on: '2026-10-28'
    date_source: assumed_today
    activities:
    - name: plank
      sets: 3
      duration:
        value: 45
        unit: s
- name: 'red band rows: a band is its label'
  inputs:
    prompt: red band rows 3x10
    deps:
      <<: *deps
      message: red band rows 3x10
  metadata:
    reported: '#395'
  expected_output:
    occurred_on: '2026-10-28'
    date_source: assumed_today
    activities:
    - name: rows
      sets: 3
      reps: 10
      band: red
- name: 'the ticket demo: a time and a band in one message'
  inputs:
    prompt: plank 3x45s, red band rows 3x10
    deps:
      <<: *deps
      message: plank 3x45s, red band rows 3x10
  metadata:
    reported: '#395'
  expected_output:
    occurred_on: '2026-10-28'
    date_source: assumed_today
    activities:
    - name: plank
      sets: 3
      duration:
        value: 45
        unit: s
    - name: rows
      sets: 3
      reps: 10
      band: red
# #622 (PRD 0013 B41): stretching, a class and indoor cardio are gym, worded as the ticket's
# ACs. No set count and a count of 1 are the same one set (ADR-0032), so `sets` is left open.
- name: 'stretching: a time alone is one timed entry'
  inputs:
    prompt: 20 min stretching
    deps:
      <<: *deps
      message: 20 min stretching
  metadata: &b41
    reported: '#622'
    prd: B41
    ignore_fields: [sets]
  expected_output:
    occurred_on: '2026-10-28'
    date_source: assumed_today
    activities:
    - name: stretching
      duration:
        value: 20
        unit: min
- name: 'stretch: time per side'
  inputs:
    prompt: hip flexor stretch 30 s each side
    deps:
      <<: *deps
      message: hip flexor stretch 30 s each side
  metadata: *b41
  expected_output:
    occurred_on: '2026-10-28'
    date_source: assumed_today
    activities:
    - name: hip flexor stretch
      duration:
        value: 30
        unit: s
      per_side: true
- name: 'class: kept by name, with session time and effort'
  inputs:
    prompt: yoga class 60 min, hard
    deps:
      <<: *deps
      message: yoga class 60 min, hard
  metadata: *b41
  expected_output:
    occurred_on: '2026-10-28'
    date_source: assumed_today
    activities:
    - name: yoga class
      duration:
        value: 60
        unit: min
    session_duration:
      value: 60
      unit: min
    effort: hard
- name: 'treadmill: indoor cardio is gym'
  inputs:
    prompt: 30 min treadmill
    deps:
      <<: *deps
      message: 30 min treadmill
  metadata: *b41
  expected_output:
    occurred_on: '2026-10-28'
    date_source: assumed_today
    activities:
    - name: treadmill
      duration:
        value: 30
        unit: min
- name: 'no effort word: rpe stays empty'
  inputs:
    prompt: rozciąganie 15 min
    deps:
      <<: *deps
      message: rozciąganie 15 min
  metadata: *b41
  expected_output:
    occurred_on: '2026-10-28'
    date_source: assumed_today
    activities:
    - name: rozciąganie
      duration:
        value: 15
        unit: min
# #631 (PRD 0013 B44): a machine's incline, level and watts, only as given, worded as the
# ticket's ACs; no field transcript holds one yet. Speed has no field and stays out.
- name: 'treadmill: incline read, speed left out'
  inputs:
    prompt: 20 min treadmill incline 5 % speed 6
    deps:
      <<: *deps
      message: 20 min treadmill incline 5 % speed 6
  metadata: &b44
    reported: '#631'
    prd: B44
    ignore_fields: [sets]
  expected_output:
    occurred_on: '2026-10-28'
    date_source: assumed_today
    activities:
    - name: treadmill
      duration:
        value: 20
        unit: min
      incline: 5
- name: 'bike erg: watts and time'
  inputs:
    prompt: bike erg 200 W 10 min
    deps:
      <<: *deps
      message: bike erg 200 W 10 min
  metadata: *b44
  expected_output:
    occurred_on: '2026-10-28'
    date_source: assumed_today
    activities:
    - name: bike erg
      duration:
        value: 10
        unit: min
      watts: 200
- name: 'cross-trainer: level'
  inputs:
    prompt: cross-trainer level 8, 15 min
    deps:
      <<: *deps
      message: cross-trainer level 8, 15 min
  metadata: *b44
  expected_output:
    occurred_on: '2026-10-28'
    date_source: assumed_today
    activities:
    - name: cross-trainer
      duration:
        value: 15
        unit: min
      level: 8
- name: 'treadmill: no settings, none invented'
  inputs:
    prompt: treadmill 20 min
    deps:
      <<: *deps
      message: treadmill 20 min
  metadata: *b44
  expected_output:
    occurred_on: '2026-10-28'
    date_source: assumed_today
    activities:
    - name: treadmill
      duration:
        value: 20
        unit: min
evaluators:
- DateMatch
- ActivitiesMatch
- SessionMatch
- QuestionMatch
