# Smoke set for router (ADR-0034, #374): 5 cases taken from
# evals/datasets/router.yaml, named in each case's `metadata.dataset`, until real chats
# arrive in evals/field/. Graded in code, run once, no judge.
name: router
cases:
- name: log gym with units
  metadata:
    plausible_sports:
    - gym
    dataset: evals/datasets/router.yaml
  inputs:
    prompt: Did 5x5 squats at 100 kg this morning
    deps:
      message: Did 5x5 squats at 100 kg this morning
      history: []
      athlete_sports:
      - climbing
      - gym
      - cycling
      today: '2026-09-30'
      now_local: '2026-09-30T18:30:00+02:00'
      timezone: Europe/Warsaw
  expected_output:
    intents:
    - kind: log_session
      confidence: 0.9
      span: ''
      sport: gym
- name: log climbing with grades
  metadata:
    plausible_sports:
    - climbing
    dataset: evals/datasets/router.yaml
  inputs:
    prompt: Sent three 6A boulders and a 6B+ at the wall
    deps:
      message: Sent three 6A boulders and a 6B+ at the wall
      history: []
      athlete_sports:
      - climbing
      - gym
      - cycling
      today: '2026-09-30'
      now_local: '2026-09-30T18:30:00+02:00'
      timezone: Europe/Warsaw
  expected_output:
    intents:
    - kind: log_session
      confidence: 0.9
      span: ''
      sport: climbing
- name: pain alone
  inputs:
    prompt: My left elbow has been aching since Tuesday
    deps:
      message: My left elbow has been aching since Tuesday
      history: []
      athlete_sports:
      - climbing
      - gym
      - cycling
      today: '2026-09-30'
      now_local: '2026-09-30T18:30:00+02:00'
      timezone: Europe/Warsaw
  expected_output:
    intents:
    - kind: wellbeing_or_injury
      confidence: 0.9
      span: ''
  metadata:
    dataset: evals/datasets/router.yaml
- name: question on recovery
  inputs:
    prompt: How many rest days should I take between hard climbing days?
    deps:
      message: How many rest days should I take between hard climbing days?
      history: []
      athlete_sports:
      - climbing
      - gym
      - cycling
      today: '2026-09-30'
      now_local: '2026-09-30T18:30:00+02:00'
      timezone: Europe/Warsaw
  expected_output:
    intents:
    - kind: ask_training_question
      confidence: 0.9
      span: ''
  metadata:
    dataset: evals/datasets/router.yaml
- name: polish message
  inputs:
    prompt: Dzisiaj zrobilem 4 przejscia 6A na scianie
    deps:
      message: Dzisiaj zrobilem 4 przejscia 6A na scianie
      history: []
      athlete_sports:
      - climbing
      - gym
      - cycling
      today: '2026-09-30'
      now_local: '2026-09-30T18:30:00+02:00'
      timezone: Europe/Warsaw
  expected_output:
    intents:
    - kind: log_session
      confidence: 0.9
      span: ''
      sport: climbing
  metadata:
    dataset: evals/datasets/router.yaml
# #421: PRD 0011's wording until field chats replace it (ADR-0034's #421 amendment). The app treats
# `ask_training_question` and `request_report` alike here, so a bench question may be either.
- name: how my bench is going
  inputs:
    prompt: How is my bench going?
    deps:
      message: How is my bench going?
      history: []
      athlete_sports:
      - gym
      today: '2026-11-02'
      now_local: '2026-11-02T18:30:00+01:00'
      timezone: Europe/Warsaw
  expected_output:
    intents:
    - kind: request_report
      confidence: 0.9
      span: ''
  metadata:
    prd: PRD 0011 flow 15
    acceptable_kinds:
    - ask_training_question
    - request_report
- name: how often to deload
  inputs:
    prompt: How often should I deload?
    deps:
      message: How often should I deload?
      history: []
      athlete_sports:
      - gym
      today: '2026-11-02'
      now_local: '2026-11-02T18:30:00+01:00'
      timezone: Europe/Warsaw
  expected_output:
    intents:
    - kind: ask_training_question
      confidence: 0.9
      span: ''
  metadata:
    prd: PRD 0011 flow 15
evaluators:
- IntentKindsMatch
- LogSessionSportMatch
