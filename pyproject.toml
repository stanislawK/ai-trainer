[project]
name = "ai-trainer"
version = "0.1.0"
description = "An AI training companion for amateur athletes."
authors = [
    { name = "Stanislaw", email = "stanislaw.krupienko@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "authlib>=1.8.0",
    "fastapi>=0.128.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-instrumentation-httpx>=0.66b1",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b1",
    "opentelemetry-sdk>=1.44.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.12",
    "pydantic-ai-slim[openai,spec,typesafe]>=2.55.0",
    "pydantic-evals>=2.57.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.0.54",
    "tzdata>=2026.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
ai-trainer = "ai_trainer.cli:main"
ai-trainer-evals = "ai_trainer.llm.evals.cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pillow>=13.0.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-playwright>=0.9.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.8",
    "squawk-cli==2.70.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
# No "TC": moving runtime-annotation imports under TYPE_CHECKING breaks PEP 649 (ADR-0002).
# C90, PLR0912, PLR0915, PLR0917 and ANN401 cap function size and parameters (#325).
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT", "N",
    "C90", "PLR0912", "PLR0915", "PLR0917", "ANN401",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Test helpers take `**overrides: Any` and build long fixtures by design; the caps are for src.
"tests/**" = ["ANN401", "C901", "PLR0912", "PLR0915", "PLR0917"]
# The release guard hook is one flat chain of independent checks, kept in one place on purpose.
".claude/hooks/guard_release.py" = ["C901", "PLR0912"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's own idiom for a form field's default value (ticket #16); the call is evaluated once
# at route-declaration time, not per-request, so B008's "mutable default" concern doesn't apply.
extend-immutable-calls = ["fastapi.Form"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "possibly-undefined",
    "unused-awaitable",
    "deprecated",
    "exhaustive-match",
]

[[tool.mypy.overrides]]
# Authlib ships no py.typed marker and no stub package exists (ADR-0005).
module = "authlib.*"
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
# tests/e2e is deliberately excluded: it needs the running compose stack (ADR-0013) and is
# run explicitly with `make e2e` / `uv run pytest tests/e2e`, never by a bare `pytest`.
testpaths = ["tests/unit", "tests/integration", "tests/migrations"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Parallel by default (#328); `-n 0` runs serially. `loadgroup` keeps each `xdist_group`
# on one worker (tests/conftest.py).
addopts = ["--strict-markers", "--strict-config", "-n", "auto", "--dist", "loadgroup"]
filterwarnings = [
    "error",
    # starlette 1.6.0's TestClient references the deprecated anyio.abc.BlockingPortal
    # alias at import time; upstream bug, not ours. No newer starlette exists yet.
    "ignore:The anyio\\.abc\\.BlockingPortal alias is deprecated:DeprecationWarning:starlette\\.testclient",
]

[tool.coverage.run]
source = ["ai_trainer"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.importlinter]
root_package = "ai_trainer"
include_external_packages = true

[[tool.importlinter.contracts]]
# ADR-0003 invariants 1-2: domain never imports up; application never imports
# a concrete adapter. The outer packages are independent siblings here; the
# next contract keeps them off adapters.
name = "Hexagonal layers (ADR-0003)"
type = "layers"
layers = [
    "ai_trainer.adapters : ai_trainer.llm : ai_trainer.mcp : ai_trainer.knowledge : ai_trainer.web",
    "ai_trainer.application",
    "ai_trainer.domain",
]

[[tool.importlinter.contracts]]
# ADR-0003 invariant 3: concrete classes are created only in the composition
# root (main.py, and cli.py as the other entry point).
name = "Outer layers do not import concrete adapters (ADR-0003)"
type = "forbidden"
source_modules = [
    "ai_trainer.web",
    "ai_trainer.llm",
    "ai_trainer.mcp",
    "ai_trainer.knowledge",
]
forbidden_modules = ["ai_trainer.adapters"]
# Allowed by name: both only bind the request and user IDs into the log record's
# context variables - a stateless logging helper, not a port-worthy adapter.
ignore_imports = [
    "ai_trainer.web.active_user_gate -> ai_trainer.adapters.log_records",
    "ai_trainer.web.request_log -> ai_trainer.adapters.log_records",
]

[[tool.importlinter.contracts]]
# The other half of invariant 1: domain imports only the standard library and
# Pydantic. The layers contract above already keeps it off application/adapters/
# llm/mcp/knowledge/web; this keeps it off every other current dependency.
# New third-party dependencies (pyproject.toml `[project.dependencies]`) need
# adding here too if domain should stay clear of them.
name = "Domain has no dependency but Pydantic (ADR-0003)"
type = "forbidden"
source_modules = ["ai_trainer.domain"]
forbidden_modules = [
    "alembic",
    "fastapi",
    "pgvector",
    "psycopg",
    "pydantic_ai",
    "pydantic_settings",
    "sqlalchemy",
    "uvicorn",
]
