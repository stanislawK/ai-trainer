[project]
name = "ai-trainer"
version = "0.1.0"
description = "An AI training companion for amateur athletes."
authors = [
    { name = "Stanislaw", email = "stanislaw.krupienko@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "authlib>=1.8.0",
    "fastapi>=0.128.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.12",
    "pydantic-ai-slim[openai,spec]>=2.46.0",
    "pydantic-evals>=2.46.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0.54",
    "uvicorn>=0.53.0",
]

[project.scripts]
ai-trainer-evals = "ai_trainer.llm.evals.cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=2.3.1",
    "pillow>=12.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-playwright>=0.9.0",
    "ruff>=0.16.8",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
# No "TC": moving runtime-annotation imports under TYPE_CHECKING breaks PEP 649 (ADR-0002).
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT", "N"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's own idiom for a form field's default value (ticket #16); the call is evaluated once
# at route-declaration time, not per-request, so B008's "mutable default" concern doesn't apply.
extend-immutable-calls = ["fastapi.Form"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Authlib ships no py.typed marker and no stub package exists (ADR-0005).
module = "authlib.*"
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
# tests/e2e is deliberately excluded: it needs the running compose stack (ADR-0013) and is
# run explicitly with `make e2e` / `uv run pytest tests/e2e`, never by a bare `pytest`.
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--strict-markers", "--strict-config"]
filterwarnings = [
    "error",
    # starlette 1.6.0's TestClient references the deprecated anyio.abc.BlockingPortal
    # alias at import time; upstream bug, not ours. No newer starlette exists yet.
    "ignore:The anyio\\.abc\\.BlockingPortal alias is deprecated:DeprecationWarning:starlette\\.testclient",
]

[tool.coverage.run]
source = ["ai_trainer"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.importlinter]
root_package = "ai_trainer"
include_external_packages = true

[[tool.importlinter.contracts]]
# ADR-0003 invariants 1-2: domain never imports up; application never imports
# a concrete adapter. Siblings in the outer layer may import each other freely -
# nothing in ADR-0003 forbids that.
name = "Hexagonal layers (ADR-0003)"
type = "layers"
layers = [
    "ai_trainer.adapters : ai_trainer.llm : ai_trainer.mcp : ai_trainer.knowledge : ai_trainer.web",
    "ai_trainer.application",
    "ai_trainer.domain",
]

[[tool.importlinter.contracts]]
# The other half of invariant 1: domain imports only the standard library and
# Pydantic. The layers contract above already keeps it off application/adapters/
# llm/mcp/knowledge/web; this keeps it off every other current dependency.
# New third-party dependencies (pyproject.toml `[project.dependencies]`) need
# adding here too if domain should stay clear of them.
name = "Domain has no dependency but Pydantic (ADR-0003)"
type = "forbidden"
source_modules = ["ai_trainer.domain"]
forbidden_modules = [
    "alembic",
    "fastapi",
    "pgvector",
    "psycopg",
    "pydantic_ai",
    "pydantic_settings",
    "sqlalchemy",
    "uvicorn",
]
