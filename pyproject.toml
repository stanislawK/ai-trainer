[project]
name = "ai-trainer"
version = "0.1.0"
description = "An AI training companion for amateur athletes."
authors = [
    { name = "Stanislaw", email = "stanislaw.krupienko@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.128.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.12",
    "pydantic-ai-slim>=2.46.0",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
# No "TC": moving runtime-annotation imports under TYPE_CHECKING breaks PEP 649 (ADR-0002).
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT", "N"]

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--strict-markers", "--strict-config"]
filterwarnings = [
    "error",
    # starlette 1.6.0's TestClient references the deprecated anyio.abc.BlockingPortal
    # alias at import time; upstream bug, not ours. No newer starlette exists yet.
    "ignore:The anyio\\.abc\\.BlockingPortal alias is deprecated:DeprecationWarning:starlette\\.testclient",
]

[tool.coverage.run]
source = ["ai_trainer"]

[tool.coverage.report]
show_missing = true
skip_covered = false
