<!doctype html>
<html
  lang="en"
  data-theme="trainer-dark"
  {% if csrf_token %}hx-headers:inherited='{"X-CSRF-Token": "{{ csrf_token }}"}'{% endif %}
>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="oklch(17% 0.012 232)" />
    <title>{% block title %}AI Trainer{% endblock %}</title>
    <link rel="manifest" href="/static/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="/static/css/app.css">
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          if (stored === "trainer-light" || stored === "trainer-dark") {
            document.documentElement.setAttribute("data-theme", stored);
          }
        } catch (e) {
          // Storage unavailable (blocked, private mode): the server-rendered default of
          // trainer-dark already stands on <html>, so there is nothing to recover from.
        }
      })();
    </script>
    <script src="/static/vendor/htmx-4.0.0.min.js"></script>
    <script src="/static/js/theme.js" defer></script>
  </head>
  <body class="min-h-screen wallpaper text-base-content">
    <svg class="absolute size-0 overflow-hidden" aria-hidden="true" focusable="false">
      <defs>
        <filter id="lg-refract" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.011 0.017" numOctaves="2" seed="4" result="noise"></feTurbulence>
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="14" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
        </filter>
      </defs>
    </svg>
    {% block content %}{% endblock %}
  </body>
</html>
