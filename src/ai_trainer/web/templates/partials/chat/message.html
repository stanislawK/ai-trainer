{%- from "components/icon.html" import icon -%}
{%- if message.role == "assistant" -%}
<div class="chat-message flex gap-2.5">
  <span class="size-7 shrink-0 rounded-[22%] glass-regular grid place-items-center text-primary" aria-hidden="true">{{ icon("mountain", "size-4") }}</span>
  <p class="min-w-0 max-w-[65ch] text-[16px] leading-6 whitespace-pre-wrap break-words">{{ message.text }}</p>
</div>
{%- else -%}
<div class="chat-message self-end max-w-[80%] lg:max-w-[70%] glass-regular bg-primary/20 rounded-3xl rounded-br-lg px-4 py-2.5 text-[16px] leading-6 whitespace-pre-wrap break-words">{{ message.text }}</div>
{%- endif -%}
